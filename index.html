<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="color-scheme" content="dark light">

<title>Jampong AI — Academic Master</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
 --bg:#090b10;
 --p:#10131a;
 --p2:#151923;
 --line:#283040;
 --txt:#f5f7fb;
 --muted:#9ca6b8;
 --a:#7c6cff;
 --user:#252d3d;
 --bad:#ff626b;
 --ok:#48d39d;
 --shadow:#0007;
}

:root.light{
 --bg:#f6f7fb;
 --p:#fff;
 --p2:#eef1f6;
 --line:#dce1ea;
 --txt:#151923;
 --muted:#667085;
 --user:#e7ebf3;
 --shadow:#18203318;
}

*{
 box-sizing:border-box;
}

html,
body{
 margin:0;
 width:100%;
 height:100%;
 background:var(--bg);
 color:var(--txt);
 font-family:
 Inter,
 system-ui,
 -apple-system,
 BlinkMacSystemFont,
 "Segoe UI",
 sans-serif;
}

body{
 overflow:hidden;
}

button,
input,
textarea,
select{
 font:inherit;
 color:inherit;
}

button{
 cursor:pointer;
}

button:disabled{
 opacity:.55;
 cursor:not-allowed;
}

/* APP */

.app{
 height:100dvh;
 display:grid;
 grid-template-columns:285px 1fr;
 overflow:hidden;
}

.side{
 background:var(--p);
 border-right:1px solid var(--line);
 display:flex;
 flex-direction:column;
 z-index:40;
}

.brand{
 padding:16px;
 display:flex;
 gap:10px;
 align-items:center;
}

.logo{
 width:42px;
 height:42px;
 border-radius:14px;
 background:linear-gradient(145deg,var(--a),#4d42c3);
 display:grid;
 place-items:center;
}

.brand b{
 font-size:18px;
}

.brand small{
 color:var(--muted);
 display:block;
}

.new{
 margin:4px 14px 10px;
 padding:12px;
 border:1px solid var(--line);
 background:var(--p2);
 border-radius:13px;
 text-align:left;
 display:flex;
 gap:9px;
 align-items:center;
}

.search{
 position:relative;
 margin:0 14px 10px;
}

.search input{
 width:100%;
 background:var(--bg);
 border:1px solid var(--line);
 border-radius:11px;
 padding:10px 10px 10px 36px;
 outline:0;
}

.search svg{
 position:absolute;
 left:11px;
 top:11px;
 color:var(--muted);
}

.history{
 overflow:auto;
 flex:1;
 padding:4px 9px;
}

.hi{
 display:flex;
 align-items:center;
 gap:7px;
 padding:10px;
 border-radius:11px;
}

.hi:hover,
.hi.active{
 background:var(--p2);
}

.hi .t{
 flex:1;
 min-width:0;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 font-size:14px;
}

.acts{
 display:flex;
 gap:1px;
}

.icon{
 border:0;
 background:transparent;
 padding:7px;
 border-radius:8px;
 display:grid;
 place-items:center;
}

.icon:hover{
 background:var(--line);
}

.sidebottom{
 border-top:1px solid var(--line);
 padding:10px;
 display:flex;
 gap:7px;
}

.sidebottom button{
 flex:1;
 border:1px solid var(--line);
 background:var(--p2);
 border-radius:10px;
 padding:9px;
}

/* TOP */

.main{
 min-width:0;
 height:100dvh;
 display:flex;
 flex-direction:column;
 position:relative;
}

.top{
 height:68px;
 flex:none;
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 gap:10px;
 padding:9px 16px;
 background:var(--bg);
 z-index:20;
}

.men{
 display:none;
}

.title{
 font-weight:700;
 flex:1;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.model{
 background:var(--p);
 border:1px solid var(--line);
 border-radius:11px;
 padding:10px;
 max-width:190px;
 outline:0;
}

.ping{
 font-size:12px;
 color:var(--muted);
 white-space:nowrap;
 display:flex;
 align-items:center;
 gap:4px;
}

.ping b{
 color:var(--ok);
 font-variant-numeric:tabular-nums;
}

.ping.off b{
 color:var(--bad);
}

/* MESSAGES */

.messages{
 flex:1;
 overflow:auto;
 padding:
 25px
 clamp(12px,5vw,70px)
 190px;
 overscroll-behavior:contain;
}

.welcome{
 max-width:820px;
 margin:5vh auto;
 text-align:center;
}

.orb{
 width:68px;
 height:68px;
 border-radius:23px;
 background:linear-gradient(145deg,var(--a),#4c40be);
 display:grid;
 place-items:center;
 margin:auto;
}

.welcome h1{
 font-size:clamp(31px,5vw,53px);
 margin:20px 0 8px;
 letter-spacing:-1.5px;
}

.welcome p{
 color:var(--muted);
 font-size:17px;
 line-height:1.6;
}

.quick{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:11px;
 text-align:left;
}

.quick button{
 background:var(--p);
 border:1px solid var(--line);
 border-radius:15px;
 padding:16px;
 min-height:84px;
}

.quick button:hover{
 border-color:var(--a);
 transform:translateY(-1px);
}

.quick b{
 display:block;
}

.quick span{
 display:block;
 color:var(--muted);
 font-size:13px;
 margin-top:5px;
}

/* CHAT */

.msg{
 max-width:920px;
 margin:0 auto 22px;
 display:flex;
 gap:11px;
 align-items:flex-start;
}

.msg.user{
 justify-content:flex-end;
}

.av{
 width:39px;
 height:39px;
 flex:0 0 39px;
 border:1px solid var(--line);
 background:var(--p);
 border-radius:13px;
 display:grid;
 place-items:center;
}

.bubble{
 max-width:84%;
 line-height:1.65;
 font-size:15.5px;
 overflow-wrap:anywhere;
}

.user .bubble{
 background:var(--user);
 padding:12px 15px;
 border-radius:17px 17px 5px 17px;
}

.status{
 display:flex;
 gap:9px;
 color:var(--muted);
 padding:5px 0;
}

.dots{
 display:flex;
 gap:4px;
}

.dots i{
 width:7px;
 height:7px;
 background:var(--a);
 border-radius:50%;
 animation:d 1s infinite;
}

.dots i:nth-child(2){
 animation-delay:.15s;
}

.dots i:nth-child(3){
 animation-delay:.3s;
}

@keyframes d{
 50%{
  opacity:.25;
  transform:translateY(-2px);
 }
}

.md h1,
.md h2,
.md h3{
 margin:16px 0 7px;
}

.md p{
 margin:8px 0;
}

.md li{
 margin:4px 0;
}

.md code{
 background:var(--p2);
 border:1px solid var(--line);
 border-radius:5px;
 padding:2px 5px;
}

.code{
 background:#080a0f;
 border:1px solid var(--line);
 border-radius:11px;
 overflow:hidden;
 margin:11px 0;
}

.codehead{
 display:flex;
 justify-content:space-between;
 padding:7px 9px;
 border-bottom:1px solid var(--line);
 color:#aab2c0;
 font-size:12px;
}

.codehead button{
 background:transparent;
 border:0;
 color:var(--txt);
 padding:4px 7px;
 border-radius:7px;
}

.codehead button:hover{
 background:#ffffff12;
}

.code pre{
 padding:13px;
 margin:0;
 overflow:auto;
 font-size:13px;
 line-height:1.5;
 color:#edf0f6;
}

.mt{
 display:flex;
 gap:3px;
 margin-top:4px;
}

.mt button{
 border:0;
 background:transparent;
 color:var(--muted);
 padding:6px;
 border-radius:7px;
}

.mt button:hover{
 background:var(--p2);
 color:var(--txt);
}

/* COMPOSER */

.composerWrap{
 position:absolute;
 left:0;
 right:0;
 bottom:0;
 padding:
 10px
 clamp(9px,3vw,25px)
 max(10px,env(safe-area-inset-bottom));
 background:
 linear-gradient(
  transparent,
  var(--bg) 25%
 );
 z-index:15;
}

.composer{
 max-width:1000px;
 margin:auto;
 background:var(--p);
 border:1px solid var(--line);
 border-radius:19px;
 padding:9px;
 box-shadow:0 18px 50px var(--shadow);
}

.files{
 display:flex;
 gap:7px;
 overflow:auto;
 padding-bottom:6px;
}

.file{
 border:1px solid var(--line);
 background:var(--p2);
 border-radius:9px;
 padding:5px 8px;
 font-size:12px;
 white-space:nowrap;
 display:flex;
 align-items:center;
 gap:5px;
}

.file button{
 border:0;
 background:transparent;
 padding:0 3px;
}

.row{
 display:flex;
 align-items:flex-end;
 gap:7px;
}

.ta{
 flex:1;
 min-width:0;
 max-height:180px;
 resize:none;
 border:0;
 outline:0;
 background:transparent;
 padding:9px;
 font-size:16px;
 line-height:1.5;
}

.tool{
 height:39px;
 min-width:39px;
 border:1px solid var(--line);
 background:var(--p2);
 border-radius:11px;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:5px;
 padding:0 10px;
 flex:0 0 auto;
}

.tool:hover{
 border-color:var(--a);
}

.tool.on{
 border-color:var(--a);
 color:#a79eff;
 background:#7c6cff18;
}

.voice.on{
 color:#ff8b94;
 border-color:#ff626b;
 background:#ff626b12;
}

.send{
 width:48px;
 height:48px;
 border:0;
 border-radius:15px;
 background:var(--a);
 display:grid;
 place-items:center;
 flex:0 0 48px;
}

.send.stop{
 background:var(--bad);
}

.tools{
 display:flex;
 gap:5px;
 overflow-x:auto;
 padding-top:6px;
 scrollbar-width:thin;
}

.tools .tool span{
 font-size:12px;
 white-space:nowrap;
}

/* MODALS */

.back{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:35;
}

.back.show{
 display:block;
}

.modalback{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 place-items:center;
 padding:16px;
 z-index:60;
}

.modalback.show{
 display:grid;
}

.modal{
 width:min(720px,100%);
 max-height:90dvh;
 overflow:auto;
 background:var(--p);
 border:1px solid var(--line);
 border-radius:19px;
 padding:17px;
}

.mh{
 display:flex;
 align-items:center;
 border-bottom:1px solid var(--line);
 padding-bottom:11px;
}

.mh h2{
 flex:1;
 margin:0;
}

.set{
 padding:13px 0;
 border-bottom:1px solid var(--line);
}

.set label{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center;
}

.sel{
 background:var(--p2);
 border:1px solid var(--line);
 border-radius:9px;
 padding:8px;
 outline:0;
}

.switch{
 width:47px;
 height:27px;
 background:var(--line);
 border-radius:99px;
 position:relative;
 cursor:pointer;
}

.switch i{
 position:absolute;
 width:21px;
 height:21px;
 background:#fff;
 border-radius:50%;
 top:3px;
 left:3px;
 transition:.2s;
}

.switch.on{
 background:var(--a);
}

.switch.on i{
 left:23px;
}

.featureGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
 margin-top:9px;
}

.feature{
 font-size:12px;
 color:var(--muted);
 border:1px solid var(--line);
 background:var(--p2);
 padding:8px;
 border-radius:9px;
}

.feature.on{
 color:var(--txt);
 border-color:var(--a);
}

.drop{
 border:1px dashed var(--line);
 border-radius:13px;
 padding:18px;
 text-align:center;
}

.preview{
 max-width:100%;
 max-height:40vh;
 display:block;
 margin:12px auto;
 border-radius:11px;
}

.image-actions{
 display:flex;
 gap:8px;
 margin-top:9px;
}

.image-actions>*{
 flex:1;
}

.result-card{
 border:1px solid var(--line);
 background:var(--p2);
 border-radius:13px;
 padding:10px;
 margin-top:10px;
}

.toast{
 position:fixed;
 z-index:100;
 bottom:20px;
 left:50%;
 transform:translate(-50%,20px);
 opacity:0;
 pointer-events:none;
 background:#171b25;
 color:white;
 border:1px solid #363d4c;
 padding:10px 13px;
 border-radius:11px;
 transition:.2s;
 max-width:92vw;
 text-align:center;
}

.toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:820px){

 .app{
  grid-template-columns:1fr;
 }

 .side{
  position:fixed;
  left:-305px;
  top:0;
  bottom:0;
  width:285px;
  transition:left .2s;
  box-shadow:0 20px 60px #0008;
 }

 .side.open{
  left:0;
 }

 .men{
  display:grid;
 }

 .top{
  padding:8px 9px;
  height:63px;
 }

 .ping{
  display:flex;
  font-size:11px;
 }

 .model{
  max-width:160px;
  padding:9px;
 }

 .messages{
  padding:
   18px
   11px
   190px;
 }

 .bubble{
  max-width:89%;
 }

 .quick{
  grid-template-columns:1fr;
 }

 .welcome{
  margin-top:3vh;
 }

 .welcome p{
  font-size:15px;
 }

 .tools .tool{
  min-width:40px;
  padding:0 9px;
 }

 .tools .tool span{
  display:none;
 }

 .composer{
  border-radius:18px;
 }

 .ta{
  font-size:16px;
 }

 .send{
  width:46px;
  height:46px;
  flex-basis:46px;
 }

 .featureGrid{
  grid-template-columns:1fr;
 }

 .modal{
  padding:14px;
 }

 .top .title{
  font-size:15px;
 }
}

@media(max-width:430px){

 .ping{
  font-size:10px;
 }

 .ping svg{
  display:none;
 }

 .model{
  max-width:145px;
 }

 .brand{
  padding:13px;
 }

 .messages{
  padding-bottom:200px;
 }

 .welcome h1{
  font-size:32px;
 }

 .welcome p{
  font-size:14px;
 }

 .quick button{
  min-height:76px;
 }

 .composerWrap{
  padding-left:6px;
  padding-right:6px;
 }

 .tool{
  min-width:38px;
  padding:0 8px;
 }

 .send{
  width:44px;
  height:44px;
  flex-basis:44px;
 }

 .row{
  gap:5px;
 }
}
</style>
</head>

<body>

<div class="app">

<aside class="side" id="side">

 <div class="brand">
  <div class="logo">
   <i data-lucide="graduation-cap"></i>
  </div>

  <div>
   <b>Jampong AI</b>
   <small>Academic Master</small>
  </div>
 </div>

 <button class="new" id="new">
  <i data-lucide="square-pen"></i>
  New chat
 </button>

 <div class="search">
  <i data-lucide="search" size="17"></i>
  <input id="search" placeholder="Search chats…">
 </div>

 <div class="history" id="history"></div>

 <div class="sidebottom">
  <button id="settings">
   <i data-lucide="settings" size="15"></i>
   Settings
  </button>

  <button id="theme">
   <i data-lucide="moon" size="15"></i>
  </button>
 </div>

</aside>

<div class="back" id="back"></div>

<main class="main">

<header class="top">

 <button
  class="icon men"
  id="menu"
  aria-label="Menu">
  <i data-lucide="menu"></i>
 </button>

 <div class="title" id="title">
  New Chat
 </div>

 <div class="ping" id="pingBox">
  <i data-lucide="activity" size="14"></i>
  <b id="ping">—</b>
  ms
 </div>

 <select
  class="model"
  id="model"
  aria-label="Model">

  <option value="gemini-3.7-flash">
   Gemini 3.7 Flash
  </option>

 </select>

</header>

<section
 class="messages"
 id="messages">
</section>

<div class="composerWrap">

 <div class="composer">

  <div
   class="files"
   id="files">
  </div>

  <div class="row">

   <button
    class="tool"
    id="attach"
    title="Attach files">

    <i data-lucide="paperclip"></i>

   </button>

   <textarea
    class="ta"
    id="input"
    rows="1"
    placeholder="Ask Jampong AI anything…">
   </textarea>

   <button
    class="tool voice"
    id="voice"
    title="Voice input">

    <i data-lucide="mic"></i>

   </button>

   <button
    class="send"
    id="send"
    title="Send">

    <i data-lucide="arrow-up"></i>

   </button>

  </div>

  <div class="tools">

   <button class="tool" id="web">
    <i data-lucide="globe"></i>
    <span>Web Search</span>
   </button>

   <button class="tool" id="study">
    <i data-lucide="book-open"></i>
    <span>Study Mode</span>
   </button>

   <button class="tool on" id="academic">
    <i data-lucide="brain"></i>
    <span>Academic Master</span>
   </button>

   <button class="tool" id="strict">
    <i data-lucide="target"></i>
    <span>Strict Tutor</span>
   </button>

   <button class="tool" id="coding">
    <i data-lucide="code-2"></i>
    <span>Coding</span>
   </button>

   <button class="tool" id="image">
    <i data-lucide="image"></i>
    <span>Dola Image</span>
   </button>

   <button class="tool" id="calc">
    <i data-lucide="calculator"></i>
    <span>Calculator</span>
   </button>

  </div>

 </div>

</div>

</main>
</div>

<input
 id="fileInput"
 type="file"
 hidden
 multiple
 accept=".pdf,.txt,.md,.csv,.json,.js,.ts,.html,.css,.py,.java,.c,.cpp,.png,.jpg,.jpeg,.webp">

<!-- SETTINGS -->

<div
 class="modalback"
 id="settingsModal">

 <div class="modal">

  <div class="mh">

   <h2>Settings</h2>

   <button
    class="icon"
    data-close="settingsModal">

    <i data-lucide="x"></i>

   </button>

  </div>

  <div class="set">

   <label>

    <b>Appearance</b>

    <select
     class="sel"
     id="appearance">

     <option value="dark">
      Dark
     </option>

     <option value="light">
      Light
     </option>

    </select>

   </label>

  </div>

  <div class="set">

   <label>

    <b>Thinking level</b>

    <select
     class="sel"
     id="thinking">

     <option value="low">
      Low
     </option>

     <option
      value="medium"
      selected>
      Medium
     </option>

     <option value="high">
      High
     </option>

    </select>

   </label>

  </div>

  <div class="set">

   <label>

    <b>Strict tutoring</b>

    <div
     class="switch"
     id="strictSwitch">

     <i></i>

    </div>

   </label>

  </div>

  <div class="set">

   <b>34/34 Services</b>

   <div
    class="featureGrid"
    id="featureGrid">
   </div>

  </div>

  <div class="set">

   <b>Developer</b>

   <p
    style="
    color:var(--muted);
    line-height:1.6">

    Jampong AI identifies its developer as
    <b>Jay-Ar Lee Espiritu</b>
    when asked.

   </p>

  </div>

 </div>

</div>

<!-- IMAGE -->

<div
 class="modalback"
 id="imageModal">

 <div class="modal">

  <div class="mh">

   <h2>Dola Image Studio</h2>

   <button
    class="icon"
    data-close="imageModal">

    <i data-lucide="x"></i>

   </button>

  </div>

  <div class="drop">

   <i
    data-lucide="wand-sparkles"
    size="30">
   </i>

   <p>
    Generate an image, or upload an image
    and describe the edit.
   </p>

   <button
    class="tool"
    id="imagePick">

    <i data-lucide="upload"></i>
    Choose image

   </button>

   <input
    id="imageFile"
    hidden
    type="file"
    accept="image/png,image/jpeg,image/webp">

  </div>

  <img
   id="imagePreview"
   class="preview"
   hidden
   alt="Image to edit">

  <textarea
   class="ta"
   id="imagePrompt"
   rows="4"
   style="
   width:100%;
   border:1px solid var(--line);
   border-radius:11px;
   margin-top:10px"
   placeholder="Example: Change the background to a clean school library while keeping the subject unchanged.">
  </textarea>

  <div class="image-actions">

   <select
    class="sel"
    id="ratio">

    <option>1:1</option>
    <option>16:9</option>
    <option>4:3</option>
    <option>3:4</option>
    <option>9:16</option>
    <option>1:4</option>
    <option>4:1</option>

   </select>

   <select
    class="sel"
    id="size">

    <option>1K</option>
    <option>2K</option>
    <option>4K</option>

   </select>

  </div>

  <button
   class="send"
   id="genImage"
   style="
   width:100%;
   margin-top:10px">

   <i data-lucide="sparkles"></i>
   Generate / Edit

  </button>

  <div id="imageResult"></div>

 </div>

</div>

<!-- RENAME -->

<div
 class="modalback"
 id="renameModal">

 <div class="modal">

  <div class="mh">

function md(x){

 x=String(x||'')

 .replace(
  /&/g,
  '&amp;'
 )

 .replace(
  /</g,
  '&lt;'
 )

 .replace(
  />/g,
  '&gt;'
 );

 const blocks=[];

 x=x.replace(
  /```([\w+-]*)\n?([\s\S]*?)```/g,

  (_,l,c)=>{

   const id=
   'code'+blocks.length;

   blocks.push(`

    <div class="code">

     <div class="codehead">

      <span>
       ${l||'code'}
      </span>

      <button
       onclick="copyCode('${id}')">

       Copy

      </button>

     </div>

     <pre id="${id}">${c}</pre>

    </div>

   `);

   return '@@C'+
   (blocks.length-1)+
   '@@';

  }

 );

 x=x

 .replace(
  /^### (.*)$/gm,
  '<h3>$1</h3>'
 )

 .replace(
  /^## (.*)$/gm,
  '<h2>$1</h2>'
 )

 .replace(
  /^# (.*)$/gm,
  '<h1>$1</h1>'
 )

 .replace(
  /\*\*(.*?)\*\*/g,
  '<strong>$1</strong>'
 )

 .replace(
  /`([^`]+)`/g,
  '<code>$1</code>'
 )

 .replace(
  /^- (.*)$/gm,
  '• $1'
 )

 .replace(
  /\n\n/g,
  '</p><p>'
 )

 .replace(
  /\n/g,
  '<br>'
 );

 x='<p>'+x+'</p>';

 return x

 .replace(
  /<p>@@C(\d+)@@<\/p>/g,
  (_,i)=>blocks[i]
 )

 .replace(
  /@@C(\d+)@@/g,
  (_,i)=>blocks[i]
 );

}

function infer(t){

 if(
  modes.coding||
  /\b(code|coding|javascript|python|html|css|java|c\+\+|program)\b/i.test(t)
 ){

  return 'Coding';

 }

 if(
  /\b(solve|math|equation|calculate|problem|formula)\b/i.test(t)
 ){

  return 'Solving';

 }

 if(
  files.length
 ){

  return 'Analyzing';

 }

 if(
  modes.web
 ){

  return 'Finding';

 }

 return 'Thinking';

}

function conversationPrompt(latest){

 const history=
 (
  cur?.messages||[]
 )
 .slice(-12)
 .map(
  m=>
   (
    m.role==='user'
    ?'Student'
    :'Jampong AI'
   )+
   ': '+
   (m.text||'')
 )
 .join('\n\n');

 return promptFor(

  (
   history
   ?history+
    '\n\n'
   :''
  )+

  'Student latest request:\n'+
  latest

 );

}

async function send(){

 if(busy)return;

 const text=
 $('#input').value.trim();

 if(
  !text&&
  !files.length
 )return;

 ensure();

 const uf=
 files.map(f=>({

  name:f.name,

  type:f.type,

  data:f.data,

  uri:f.uri,

  mimeType:f.mimeType

 }));

 const userText=
 text||
 'Analyze the attached file(s).';

 cur.messages.push({

  id:crypto.randomUUID(),

  role:'user',

  text:userText,

  files:uf

 });

 if(
  cur.title===
  'New Chat'
 ){

  cur.title=
  userText.slice(
   0,
   42
  );

 }

 save();

 render();

 $('#input').value='';

 resize();

 const st=
 status(
  infer(text)
 );

 busy=true;

 ctrl=
 new AbortController();

 $('#send')
  .classList
  .add('stop');

 $('#send').innerHTML=
 '<i data-lucide="square"></i>';

 icons();

 try{

  const payload={

   model:
   'gemini-3.7-flash',

   message:
   conversationPrompt(
    userText
   ),

   files:uf,

   webSearch:
   modes.web,

   thinking:
   $('#thinking').value

  };

  const r=
  await fetch(
   '/api/chat',
   {
    method:'POST',

    headers:{
     'Content-Type':
     'application/json',

     'Accept':
     'text/event-stream'
    },

    body:
    JSON.stringify(payload),

    signal:
    ctrl.signal
   }
  );

  if(!r.ok){

   const j=
   await r.json()
   .catch(
    ()=>({})
   );

   throw Error(
    j.error||
    'HTTP '+r.status
   );

  }

  if(!r.body){

   throw Error(
    'Streaming is unavailable in this browser.'
   );

  }

  const reader=
  r.body.getReader();

  const dec=
  new TextDecoder();

  let buf='';

  let answer='';

  while(true){

   const q=
   await reader.read();

   if(q.done)break;

   buf+=
   dec.decode(
    q.value,
    {
     stream:true
    }
   );

   const chunks=
   buf.split(
    /\r?\n\r?\n/
   );

   buf=
   chunks.pop()||
   '';

   for(
    const ch of chunks
   ){

    const lines=
    ch.split(
     /\r?\n/
    );

    const ds=
    lines

    .filter(
     x=>
     x.startsWith(
      'data:'
     )
    )

    .map(
     x=>
     x.slice(5).trim()
    );

    if(!ds.length)
     continue;

    const raw=
    ds.join('');

    if(
     !raw||
     raw==='[DONE]'
    )continue;

    let ev;

    try{

     ev=
     JSON.parse(raw);

    }catch{

     continue;

    }

    if(
     ev.type==='text'
    ){

     answer+=
     ev.text||'';

     st.querySelector(
      '.md'
     ).innerHTML=
     md(answer);

     scroll();

    }

    else if(
     ev.type==='status'
    ){

     st.querySelector(
      '.status span:last-child'
     ).textContent=
     ev.text||
     'Thinking…';

    }

    else if(
     ev.type==='error'
    ){

     throw Error(
      ev.error||
      'Gemini stream error'
     );

    }

   }

  }

  if(!answer){

   throw Error(
    'No response returned by Gemini. Check the Vercel function logs and GEMINI_API_KEYS.'
   );

  }

  cur.messages.push({

   id:
   crypto.randomUUID(),

   role:
   'assistant',

   text:
   answer

  });

  st.remove();

  files=[];

  renderFiles();

  save();

  render();

 }

 catch(e){

  if(
   e.name===
   'AbortError'
  ){

   st.remove();

   toast(
    'Generation stopped'
   );

  }

  else{

   const s=
   st.querySelector(
    '.status'
   );

   if(s)
    s.remove();

   st.querySelector(
    '.md'
   ).innerHTML=
   '<p><strong>Error:</strong> '+
   esc(e.message)+
   '</p>';

   toast(
    e.message
   );

  }

 }

 finally{

  busy=false;

  ctrl=null;

  $('#send')
   .classList
   .remove('stop');

  $('#send').innerHTML=
   '<i data-lucide="arrow-up"></i>';

  icons();

  ping();

 }

}

function esc(x){

 return String(x??'')

 .replace(
  /&/g,
  '&amp;'
 )

 .replace(
  /</g,
  '&lt;'
 )

 .replace(
  />/g,
  '&gt;'
 )

 .replace(
  /"/g,
  '&quot;'
 );

}

async function regen(id){

 if(busy)return;

 const i=
 cur.messages.findIndex(
  x=>x.id===id
 );

 const u=
 cur.messages[i-1];

 if(
  i<0||
  !u||
  u.role!=='user'
 )return;

 cur.messages.splice(
  i,
  1
 );

 $('#input').value=
 u.text;

 resize();

 save();

 render();

 await send();

}

   v==='up'
   ?'Thanks for the feedback'
   :'Feedback recorded'
  );

  );

async function ping(){

 const t=
 performance.now();

 try{

  const r=
  await fetch(
   '/api/chat',
   {
    cache:'no-store'
   }
  );

  if(!r.ok)
   throw Error();

  const ms=
  Math.max(
   1,
   Math.round(
    performance.now()-t
   )
  );

  $('#ping')
   .textContent=
   ms;

  $('#pingBox')
   .classList
   .remove('off');

 }catch{

  $('#ping')
   .textContent=
   '—';

  $('#pingBox')
   .classList
   .add('off');

 }

}

    'button'

    files.splice(
     i,
     1
    );

    renderFiles();

   };

   box.appendChild(d);

  }
 );

function read(f){

 return new Promise(
  (resolve,reject)=>{

   const r=
   new FileReader();

   r.onload=
   ()=>resolve(
    r.result
   );

   r.onerror=
   reject;

   r.readAsDataURL(f);

  }
 );

}

async function addFiles(list){

 for(
  const f of [...list]
 ){

  if(
   f.size>
   50*1024*1024
  ){

   toast(
    f.name+
    ' is larger than 50 MB'
   );

   continue;

  }

  const d=
  await read(f);

  const item={

   name:f.name,

   type:
   f.type||
   'application/octet-stream',

   data:
   String(d)
   .split(',')[1]||
   ''

  };

  if(
   item.type.startsWith(
    'image/'
   )||
   item.type===
   'application/pdf'
  ){

   try{

    toast(
     'Uploading '+
     f.name+
     '…'
    );

    const r=
    await fetch(
     '/api/files',
     {
      method:'POST',

      headers:{
       'Content-Type':
       'application/json'
      },

      body:
      JSON.stringify({
       file:item
      })
     }
    );

    const j=
    await r.json()
    .catch(
     ()=>({})
    );

    if(!r.ok){

     throw Error(
      j.error||
      'Upload failed'
     );

    }

    item.uri=
    j.uri;

    item.mimeType=
    j.mimeType||
    item.type;

    toast(
     f.name+
     ' ready'
    );

   }catch(e){

    toast(
     e.message
    );

    continue;

   }

  }

  files.push(item);

 }

 renderFiles();

}

function open(id){

 $('#'+id)
 ?.classList
 .add('show');

 icons();

}

function close(id){

 $('#'+id)
 ?.classList
 .remove('show');

}

function closeSide(){

 $('#side')
  .classList
  .remove('open');

 $('#back')
  .classList
  .remove('show');

}

function calc(){

 const x=
 prompt(
  'Basic calculation, e.g. (25*4)/5 + 7'
 );

 if(!x)return;

 try{

  if(
   !/^[0-9+\-*/().%\s^]+$/
   .test(x)
  ){

   throw Error(
    'Only basic arithmetic is allowed.'
   );

  }

  const n=
  Function(
   '"use strict";return '+
   x.replace(
    /\^/g,
    '**'
   )
  )();

  $('#input').value=
  x+
  ' = '+
  n;

  resize();

  $('#input').focus();

 }catch(e){

  toast(
   e.message
  );

 }

}

async function pickImage(f){

 const d=
 await read(f);

 imageData=
 String(d)
 .split(',')[1]||
 '';

 imageMime=
 f.type||
 'image/jpeg';

 $('#imagePreview').src=
 d;

 $('#imagePreview')
  .hidden=false;

}

async function genImage(){

 const p=
 $('#imagePrompt')
 .value
 .trim();

 if(!p){

  toast(
   'Enter an image prompt'
  );

  return;

 }

 const b=
 $('#genImage');

 b.disabled=true;

 b.innerHTML=
 'Generating…';

 try{

  const r=
  await fetch(
   '/api/image',
   {
    method:'POST',

    headers:{
     'Content-Type':
     'application/json'
    },

    body:
    JSON.stringify({

     prompt:p,

     aspectRatio:
     $('#ratio').value,

     imageSize:
     $('#size').value,

     imageData,

     imageMimeType:
     imageMime

    })

   }
  );

  const j=
  await r.json()
  .catch(
   ()=>({})
  );

  if(!r.ok){

   throw Error(
    j.error||
    'Image generation failed'
   );

  }

  if(!j.data){

   throw Error(
    'The image model returned no image.'
   );

  }

  $('#imageResult')
  .innerHTML=`

   <div class="result-card">

    <img
     class="preview"
     src="data:${j.mimeType||'image/jpeg'};base64,${j.data}"
     alt="Generated image">

    <a
     class="tool"
     style="
      width:100%;
      text-decoration:none"
     download="jampong-ai-image.jpg"
     href="data:${j.mimeType||'image/jpeg'};base64,${j.data}">

     <i data-lucide="download"></i>

     Save image

    </a>

   </div>

  `;

  icons();

  toast(
   'Image ready'
  );

 }catch(e){

  toast(
   e.message
  );

 }finally{

  b.disabled=false;

  b.innerHTML=
  '<i data-lucide="sparkles"></i> Generate / Edit';

  icons();

 }

}

function theme(v){

 document.documentElement
  .classList
  .toggle(
   'light',
   v==='light'
  );

 prefs.theme=v;

 savePrefs();

 $('#appearance')
  .value=v;

 $('#theme')
  .innerHTML=
  v==='light'
  ?'<i data-lucide="sun" size="15"></i>'
  :'<i data-lucide="moon" size="15"></i>';

 icons();

}

/* EVENTS */

$('#new').onclick=
newChat;

$('#menu').onclick=()=>{

 $('#side')
  .classList
  .add('open');

 $('#back')
  .classList
  .add('show');

};

$('#back').onclick=
closeSide;

$('#search').oninput=
e=>
 renderHistory(
  e.target.value
 );

$('#settings').onclick=
()=>open(
 'settingsModal'
);

$('#theme').onclick=
()=>theme(
 document.documentElement
  .classList
  .contains('light')
  ?'dark'
  :'light'
);

$('#input').oninput=
resize;

$('#input').onkeydown=
e=>{

 if(
  e.key==='Enter'&&
  !e.shiftKey
 ){

  e.preventDefault();

  send();

 }

};

$('#send').onclick=
()=>{

 if(busy){

  ctrl?.abort();

 }else{

  send();

 }

};

$('#attach').onclick=
()=>$('#fileInput').click();

$('#fileInput').onchange=
e=>{

 addFiles(
  e.target.files
 );

 e.target.value='';

};

[
 'web',
 'study',
 'academic',
 'strict',
 'coding'
].forEach(
 k=>
 $('#'+k).onclick=
 ()=>toggle(k)
);

$('#calc').onclick=
calc;

$('#image').onclick=
()=>open(
 'imageModal'
);

$('#imagePick').onclick=
()=>$('#imageFile').click();

$('#imageFile').onchange=
e=>{

 const f=
 e.target.files[0];

 if(f)
  pickImage(f);

 e.target.value='';

};

$('#genImage').onclick=
genImage;

/* VOICE */

$('#voice').onclick=()=>{

 const SR=
 window.SpeechRecognition||
 window.webkitSpeechRecognition;

 if(!SR){

  toast(
   'Voice input is not supported by this browser.'
  );

  return;

 }

 if(window._sr){

  window._sr.stop();

  return;

 }

 const sr=
 new SR();

 sr.lang=
 navigator.language||
 'en-US';

 sr.interimResults=
 true;

 sr.continuous=
 false;

 sr.onstart=()=>{

  $('#voice')
   .classList
   .add('on');

  toast(
   'Listening…'
  );

 };

 sr.onresult=e=>{

  let text='';

  for(
   let i=e.resultIndex;
   i<e.results.length;
   i++
  ){

   text+=
   e.results[i][0]
    .transcript;

  }

  $('#input').value=
  text;

  resize();

 };

 sr.onerror=()=>{

  toast(
   'Voice input error'
  );

 };

 sr.onend=()=>{

  $('#voice')
   .classList
   .remove('on');

  window._sr=null;

 };

 window._sr=sr;

 sr.start();

};

/* SETTINGS */

$('#appearance').onchange=
e=>
 theme(
  e.target.value
 );

$('#thinking').onchange=
e=>{

 prefs.thinking=
 e.target.value;

 savePrefs();

};

$('#strictSwitch').onclick=
()=>toggle('strict');

$('#renameSave').onclick=()=>{

 const c=
 chats.find(
  x=>x.id===renameId
 );

 if(c){

  c.title=
  $('#renameInput')
   .value
   .trim()||
  'New Chat';

  save();

  renderHistory();

  if(
   cur?.id===c.id
  ){

   $('#title')
    .textContent=
    c.title;

  }

 }

 close(
  'renameModal'
 );

};

$$('[data-close]')
.forEach(
 x=>
 x.onclick=
 ()=>close(
  x.dataset.close
 )
);

$$('.modalback')
.forEach(
 x=>
 x.onclick=e=>{

  if(
   e.target===x
  ){

   x.classList
    .remove('show');

  }

 }
);

/* SWIPE */

let sx=0;

document.addEventListener(
 'touchstart',
 e=>{

  sx=
  e.changedTouches[0]
   .screenX;

 },
 {
  passive:true
 }
);

document.addEventListener(
 'touchend',
 e=>{

  const dx=
  e.changedTouches[0]
   .screenX-
  sx;

  if(
   Math.abs(dx)>70
  ){

   if(dx>0){

    $('#side')
     .classList
     .add('open');

    $('#back')
     .classList
     .add('show');

   }else{

    closeSide();

   }

  }

 },
 {
  passive:true
 }
);

/* INIT */

function init(){

 if(
  !chats.length
 ){

  newChat();

 }else{

  cur=
  chats[0];

  modes={
   ...modes,
   ...(cur.mode||{})
  };

  renderHistory();

  render();

 }

 theme(
  prefs.theme||
  'dark'
 );

 $('#thinking')
  .value=
  prefs.thinking||
  'medium';

 features.forEach(
  (x,i)=>{

   const d=
   document.createElement(
    'div'
   );

   d.className=
   'feature on';

   d.textContent=
   (i+1)+
   '. '+
   x;

   $('#featureGrid')
    .appendChild(d);

  }
 );

 syncModes();

 icons();

 ping();

 setInterval(
  ping,
  15000
 );

}

init();

</script>
