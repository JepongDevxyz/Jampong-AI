<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="description"
      content="Jampong AI — student-focused AI tutor">

<title>Jampong AI</title>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root{
  --bg:#090b10;
  --panel:#10131a;
  --panel2:#151922;
  --panel3:#1b202b;
  --border:#293140;
  --text:#f5f7fb;
  --muted:#9ca5b5;
  --accent:#8b7cff;
  --accent2:#6557ef;
  --danger:#ff6262;
  --success:#55d88a;
  --shadow:0 18px 50px rgba(0,0,0,.35);
  --radius:20px;
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  overflow:hidden;
}

button,
textarea,
input,
select{
  font:inherit;
}

button{
  color:inherit;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  overflow:hidden;
}

/* SIDEBAR */

.sidebar{
  width:280px;
  min-width:280px;
  height:100%;
  background:#0d1016;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:14px;
  z-index:50;
  transition:.25s ease;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 6px 16px;
}

.brand-logo{
  width:38px;
  height:38px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(
    135deg,
    #8c78ff,
    #5d4be8
  );
}

.brand-title{
  font-weight:800;
  font-size:18px;
}

.brand-sub{
  color:var(--muted);
  font-size:11px;
}

.new-chat{
  width:100%;
  min-height:46px;
  border:1px solid var(--border);
  background:var(--panel2);
  border-radius:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-weight:700;
}

.new-chat:hover{
  border-color:var(--accent);
}

.history{
  flex:1;
  overflow:auto;
  margin-top:14px;
}

.history-title{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  padding:8px;
}

.chat-item{
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:4px;
}

.chat-item:hover,
.chat-item.active{
  background:var(--panel2);
}

.chat-name{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
}

.chat-actions{
  display:flex;
  gap:2px;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  border:1px solid var(--border);
  background:transparent;
  display:grid;
  place-items:center;
  cursor:pointer;
}

.icon-btn:hover{
  background:var(--panel2);
}

.small-btn{
  width:32px;
  height:32px;
}

.sidebar-bottom{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding-top:10px;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar{
  height:72px;
  min-height:72px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 18px;
  border-bottom:1px solid var(--border);
  background:rgba(9,11,16,.92);
  backdrop-filter:blur(14px);
  z-index:20;
}

.mobile-menu{
  display:none;
}

.title{
  font-size:18px;
  font-weight:800;
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.model-select{
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  padding:11px 14px;
  border-radius:14px;
  outline:none;
  max-width:190px;
}

.chat{
  flex:1;
  min-height:0;
  overflow:auto;
  scroll-behavior:smooth;
}

.welcome{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px 20px 180px;
  text-align:center;
}

.logo-big{
  width:78px;
  height:78px;
  border-radius:26px;
  display:grid;
  place-items:center;
  background:linear-gradient(
    135deg,
    #8e7cff,
    #5c49e6
  );
  margin-bottom:18px;
}

.welcome h1{
  margin:0;
  font-size:clamp(28px,5vw,48px);
}

.welcome p{
  max-width:720px;
  color:var(--muted);
  line-height:1.65;
  font-size:17px;
}

.quick-grid{
  width:min(760px,100%);
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:20px;
}

.quick{
  text-align:left;
  border:1px solid var(--border);
  background:var(--panel);
  padding:17px;
  border-radius:17px;
  cursor:pointer;
}

.quick:hover{
  border-color:var(--accent);
  transform:translateY(-1px);
}

.quick strong{
  display:block;
  font-size:15px;
  margin-bottom:5px;
}

.quick span{
  color:var(--muted);
  font-size:13px;
}

/* MESSAGES */

.messages{
  width:min(920px,100%);
  margin:auto;
  padding:26px 18px 170px;
}

.message{
  display:flex;
  gap:12px;
  margin:18px 0;
  min-width:0;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:min(800px,90%);
  border-radius:18px;
  padding:13px 15px;
  line-height:1.65;
  overflow:hidden;
}

.user .bubble{
  background:#252b39;
}

.assistant .bubble{
  background:transparent;
  padding-left:0;
}

.avatar{
  flex:0 0 34px;
  width:34px;
  height:34px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:var(--panel2);
  border:1px solid var(--border);
}

.message-body{
  min-width:0;
}

.message-tools{
  display:flex;
  gap:6px;
  margin-top:7px;
  flex-wrap:wrap;
}

.tool-mini{
  border:1px solid var(--border);
  background:transparent;
  color:var(--muted);
  border-radius:9px;
  padding:6px 8px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11px;
}

.tool-mini:hover{
  color:var(--text);
  background:var(--panel2);
}

pre{
  background:#07090d;
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
  overflow:auto;
  position:relative;
}

code{
  font-family:
    "SFMono-Regular",
    Consolas,
    monospace;
}

.inline-code{
  background:var(--panel2);
  padding:2px 5px;
  border-radius:6px;
}

.thinking{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--muted);
  font-size:13px;
}

.dots{
  display:flex;
  gap:4px;
}

.dots i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--accent);
  animation:pulse 1s infinite;
}

.dots i:nth-child(2){
  animation-delay:.15s;
}

.dots i:nth-child(3){
  animation-delay:.3s;
}

@keyframes pulse{
  0%,100%{opacity:.25}
  50%{opacity:1}
}

/* COMPOSER */

.composer-wrap{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(
    transparent,
    var(--bg) 28%
  );
  z-index:30;
}

.composer{
  width:min(920px,100%);
  margin:auto;
  border:1px solid var(--border);
  background:rgba(17,20,27,.97);
  border-radius:22px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.attach-preview{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:10px 12px 0;
}

.file-chip{
  border:1px solid var(--border);
  background:var(--panel2);
  border-radius:10px;
  padding:7px 9px;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
}

.composer-main{
  display:flex;
  align-items:flex-end;
  gap:9px;
  padding:10px;
}

#input{
  flex:1;
  min-width:0;
  max-height:180px;
  min-height:48px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:11px 4px;
  line-height:1.5;
}

.send{
  width:48px;
  height:48px;
  flex:0 0 48px;
  border:0;
  border-radius:15px;
  background:var(--accent);
  display:grid;
  place-items:center;
  cursor:pointer;
}

.send:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.send.stop{
  background:var(--danger);
}

.composer-tools{
  display:flex;
  gap:5px;
  overflow:auto;
  padding:0 9px 9px;
}

.composer-tool{
  flex:0 0 auto;
  height:38px;
  min-width:38px;
  padding:0 10px;
  border:1px solid var(--border);
  border-radius:11px;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:var(--muted);
}

.composer-tool.active{
  color:var(--text);
  border-color:var(--accent);
  background:rgba(139,124,255,.12);
}

.composer-tool:hover{
  color:var(--text);
  background:var(--panel2);
}

.ping{
  margin-left:auto;
  color:var(--muted);
  font-size:11px;
  display:flex;
  align-items:center;
  gap:5px;
}

/* DRAWER */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:45;
  display:none;
}

.overlay.show{
  display:block;
}

/* MODALS */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:100;
  background:rgba(0,0,0,.65);
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(760px,100%);
  max-height:90dvh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:18px;
}

.modal-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.modal-head h2{
  flex:1;
  margin:0;
}

.form{
  display:grid;
  gap:12px;
}

.field{
  display:grid;
  gap:6px;
}

.field label{
  color:var(--muted);
  font-size:12px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:12px;
  padding:11px;
  outline:none;
}

.primary{
  border:0;
  background:var(--accent);
  color:white;
  border-radius:12px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:700;
}

.danger{
  background:var(--danger);
}

.image-preview{
  width:100%;
  max-height:55dvh;
  object-fit:contain;
  border-radius:16px;
  background:#07090d;
  margin-top:12px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:100px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  z-index:200;
  background:#202532;
  border:1px solid var(--border);
  padding:11px 15px;
  border-radius:13px;
  box-shadow:var(--shadow);
  transition:.2s ease;
  max-width:min(90vw,500px);
  font-size:13px;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* LIGHT */

body.light{
  --bg:#f6f7fb;
  --panel:#ffffff;
  --panel2:#f0f2f7;
  --panel3:#e8ebf2;
  --border:#d8dce6;
  --text:#151821;
  --muted:#657083;
  --shadow:0 18px 50px rgba(20,25,40,.12);
}

body.light .sidebar{
  background:#fff;
}

body.light .topbar{
  background:rgba(246,247,251,.94);
}

body.light .composer{
  background:rgba(255,255,255,.96);
}

body.light pre{
  background:#f0f2f6;
}

/* MOBILE */

@media(max-width:800px){

  .sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    transform:translateX(-105%);
    box-shadow:var(--shadow);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .mobile-menu{
    display:grid;
  }

  .topbar{
    padding:10px 12px;
  }

  .model-select{
    max-width:150px;
  }

  .welcome{
    justify-content:flex-start;
    padding-top:70px;
  }

  .quick-grid{
    grid-template-columns:1fr;
  }

  .messages{
    padding-left:12px;
    padding-right:12px;
  }

  .bubble{
    max-width:94%;
  }

  .composer-wrap{
    padding-left:8px;
    padding-right:8px;
  }

  .composer-tool span{
    display:none;
  }

  .ping{
    display:none;
  }
}

@media(max-width:480px){

  .topbar{
    height:64px;
    min-height:64px;
  }

  .title{
    font-size:16px;
  }

  .model-select{
    max-width:130px;
    padding:9px 8px;
    font-size:12px;
  }

  .welcome h1{
    font-size:29px;
  }

  .welcome p{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside id="sidebar" class="sidebar">

    <div class="brand">
      <div class="brand-logo">
        <i data-lucide="graduation-cap"></i>
      </div>

      <div>
        <div class="brand-title">
          Jampong AI
        </div>
        <div class="brand-sub">
          Student AI Tutor
        </div>
      </div>
    </div>

    <button
      id="newChat"
      class="new-chat">
      <i data-lucide="plus"></i>
      New Chat
    </button>

    <div class="history">
      <div class="history-title">
        CHAT HISTORY
      </div>

      <div id="historyList"></div>
    </div>

    <div class="sidebar-bottom">

      <button
        id="themeBtn"
        class="icon-btn"
        title="Theme">
        <i data-lucide="sun-moon"></i>
      </button>

      <button
        id="settingsBtn"
        class="icon-btn"
        title="Settings">
        <i data-lucide="settings"></i>
      </button>

    </div>

  </aside>

  <div id="overlay"
       class="overlay"></div>

  <main class="main">

    <header class="topbar">

      <button
        id="menuBtn"
        class="icon-btn mobile-menu">
        <i data-lucide="menu"></i>
      </button>

      <div
        id="chatTitle"
        class="title">
        New Chat
      </div>

      <select
        id="modelSelect"
        class="model-select">
        <option value="gemini-3.7-flash">
          Gemini 3.7 Flash
        </option>
      </select>

    </header>

    <section
      id="chat"
      class="chat">

      <div
        id="welcome"
        class="welcome">

        <div class="logo-big">
          <i data-lucide="graduation-cap"
             size="42"></i>
        </div>

        <h1>
          What can I help you study?
        </h1>

        <p>
          Your student-focused AI tutor for
          lessons, homework, coding, research,
          file analysis and more.
        </p>

        <div class="quick-grid">

          <button
            class="quick"
            data-prompt="Explain this lesson to me in a simple way with examples.">
            <strong>Explain a lesson</strong>
            <span>Learn difficult concepts</span>
          </button>

          <button
            class="quick"
            data-prompt="Help me solve this problem step by step and explain the solution.">
            <strong>Solve a problem</strong>
            <span>Math and science help</span>
          </button>

          <button
            class="quick"
            data-prompt="Help me write and understand code. Explain every important part.">
            <strong>Code with me</strong>
            <span>Programming assistant</span>
          </button>

          <button
            class="quick"
            data-prompt="Create a study guide for an important school topic.">
            <strong>Study guide</strong>
            <span>Review faster</span>
          </button>

        </div>

      </div>

      <div
        id="messages"
        class="messages"
        style="display:none">
      </div>

    </section>

    <div class="composer-wrap">

      <div class="composer">

        <div
          id="attachPreview"
          class="attach-preview">
        </div>

        <div class="composer-main">

          <button
            id="attachBtn"
            class="icon-btn"
            title="Attach file">
            <i data-lucide="paperclip"></i>
          </button>

          <textarea
            id="input"
            rows="1"
            maxlength="20000"
            placeholder="Ask Jampong AI anything..."></textarea>

          <button
            id="voiceBtn"
            class="icon-btn"
            title="Voice input">
            <i data-lucide="mic"></i>
          </button>

          <button
            id="send"
            class="send"
            disabled
            title="Send">
            <i data-lucide="arrow-up"></i>
          </button>

        </div>

        <div class="composer-tools">

          <button
            id="webBtn"
            class="composer-tool"
            title="Web Search">
            <i data-lucide="globe-2"></i>
            <span>Web</span>
          </button>

          <button
            id="studyBtn"
            class="composer-tool"
            title="Study Mode">
            <i data-lucide="book-open"></i>
            <span>Study</span>
          </button>

          <button
            id="masterBtn"
            class="composer-tool"
            title="Academic Master">
            <i data-lucide="brain"></i>
            <span>Master</span>
          </button>

          <button
            id="strictBtn"
            class="composer-tool"
            title="Strict Tutoring Subject">
            <i data-lucide="target"></i>
            <span>Strict</span>
          </button>

          <button
            id="codingBtn"
            class="composer-tool"
            title="Coding Assistant">
            <i data-lucide="code-2"></i>
            <span>Code</span>
          </button>

          <button
            id="dolaBtn"
            class="composer-tool"
            title="Dola Image">
            <i data-lucide="image"></i>
            <span>Dola</span>
          </button>

          <button
            id="calcBtn"
            class="composer-tool"
            title="Calculator">
            <i data-lucide="calculator"></i>
            <span>Calc</span>
          </button>

          <div
            id="ping"
            class="ping">
            <i data-lucide="activity"
               size="13"></i>
            <span>— ms</span>
          </div>

        </div>

      </div>

    </div>

  </main>

</div>


<!-- DOLA -->

<div
  id="dolaModal"
  class="modal">

  <div class="modal-card">

    <div class="modal-head">
      <i data-lucide="image"></i>
      <h2>Dola Image Studio</h2>

      <button
        class="icon-btn"
        data-close="dolaModal">
        <i data-lucide="x"></i>
      </button>
    </div>

    <div class="form">

      <div class="field">
        <label>
          Image / Edit Prompt
        </label>

        <textarea
          id="dolaPrompt"
          rows="5"
          placeholder="Example: Change the background to a modern school campus at sunset."></textarea>
      </div>

      <div class="field">

        <label>
          Optional image for editing
        </label>

        <input
          id="dolaFile"
          type="file"
          accept="image/png,image/jpeg,image/webp">

      </div>

      <div
        style="display:grid;grid-template-columns:1fr 1fr;gap:10px">

        <div class="field">

          <label>
            Aspect ratio
          </label>

          <select id="dolaRatio">
            <option>1:1</option>
            <option>16:9</option>
            <option>9:16</option>
            <option>4:3</option>
            <option>3:4</option>
          </select>

        </div>

        <div class="field">

          <label>
            Image size
          </label>

          <select id="dolaSize">
            <option>1K</option>
            <option>2K</option>
            <option>4K</option>
          </select>

        </div>

      </div>

      <button
        id="generateImage"
        class="primary">
        <i data-lucide="sparkles"></i>
        Generate / Edit Image
      </button>

      <img
        id="dolaResult"
        class="image-preview"
        style="display:none">

      <button
        id="downloadImage"
        class="primary"
        style="display:none">
        <i data-lucide="download"></i>
        Save Image
      </button>

    </div>

  </div>
</div>


<!-- CALCULATOR -->

<div
  id="calcModal"
  class="modal">

  <div class="modal-card"
       style="max-width:420px">

<script>
"use strict";

/* -----------------------------
   STATE
----------------------------- */

const state = {

  chats: [],

  activeChat: null,

  generating: false,

  controller: null,

  previousInteractionId: null,

  attachments: [],

  webSearch: false,

  studyMode: false,

  academicMaster: false,

  strictSubject: false,

  codingAssistant: false,

  thinkingLevel:
    localStorage.getItem(
      "jampong-thinking"
    ) || "medium",

  theme:
    localStorage.getItem(
      "jampong-theme"
    ) || "dark"
};


/* -----------------------------
   ELEMENTS
----------------------------- */

const $ = id =>
  document.getElementById(id);

const input =
  $("input");

const sendBtn =
  $("send");

const messages =
  $("messages");

const welcome =
  $("welcome");

const sidebar =
  $("sidebar");

const overlay =
  $("overlay");

const historyList =
  $("historyList");


/* -----------------------------
   LOCAL STORAGE
----------------------------- */

function loadChats(){

  try {

    state.chats =
      JSON.parse(
        localStorage.getItem(
          "jampong-chats"
        ) || "[]"
      );

  } catch {

    state.chats = [];

  }

  renderHistory();
}

function saveChats(){

  localStorage.setItem(
    "jampong-chats",
    JSON.stringify(
      state.chats
    )
  );
}


/* -----------------------------
   TOAST
----------------------------- */

let toastTimer;

function toast(text){

  const el =
    $("toast");

  el.textContent =
    text;

  el.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () =>
        el.classList.remove(
          "show"
        ),
      2800
    );
}


/* -----------------------------
   THEME
----------------------------- */

function applyTheme(){

  document.body.classList.toggle(
    "light",
    state.theme === "light"
  );

  $("themeSelect").value =
    state.theme;
}

$("themeBtn").onclick = () => {

  state.theme =
    state.theme === "dark"
      ? "light"
      : "dark";

  localStorage.setItem(
    "jampong-theme",
    state.theme
  );

  applyTheme();
};

$("themeSelect").onchange =
e => {

  state.theme =
    e.target.value;

  localStorage.setItem(
    "jampong-theme",
    state.theme
  );

  applyTheme();
};


/* -----------------------------
   DRAWER
----------------------------- */

function openDrawer(){

  sidebar.classList.add(
    "open"
  );

  overlay.classList.add(
    "show"
  );
}

function closeDrawer(){

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "show"
  );
}

$("menuBtn").onclick =
openDrawer;

overlay.onclick =
closeDrawer;


/* -----------------------------
   SWIPE LEFT / RIGHT
----------------------------- */

let touchStartX = 0;

document.addEventListener(
  "touchstart",
  e => {

    touchStartX =
      e.changedTouches[0].clientX;

  },
  { passive:true }
);

document.addEventListener(
  "touchend",
  e => {

    const endX =
      e.changedTouches[0].clientX;

    const delta =
      endX - touchStartX;

    if (
      Math.abs(delta) < 70
    ) return;

    if (
      delta > 0 &&
      touchStartX < 70
    ) {
      openDrawer();
    }

    if (
      delta < 0
    ) {
      closeDrawer();
    }

  },
  { passive:true }
);


/* -----------------------------
   CHAT HISTORY
----------------------------- */

function renderHistory(){

  historyList.innerHTML = "";

  for (
    const chat of state.chats
  ) {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "chat-item" +
      (
        chat.id ===
        state.activeChat
          ? " active"
          : ""
      );

    const name =
      document.createElement(
        "div"
      );

    name.className =
      "chat-name";

    name.textContent =
      chat.title ||
      "New Chat";

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "chat-actions";

    const rename =
      document.createElement(
        "button"
      );

    rename.className =
      "icon-btn small-btn";

    rename.innerHTML =
      '<i data-lucide="pencil"></i>';

    rename.onclick =
      e => {

        e.stopPropagation();

        const next =
          prompt(
            "Rename chat:",
            chat.title
          );

        if (
          next &&
          next.trim()
        ) {

          chat.title =
            next.trim();

          saveChats();

          renderHistory();

          if (
            chat.id ===
            state.activeChat
          ) {
            $("chatTitle")
              .textContent =
              chat.title;
          }
        }
      };

    const del =
      document.createElement(
        "button"
      );

    del.className =
      "icon-btn small-btn";

    del.innerHTML =
      '<i data-lucide="trash-2"></i>';

    del.onclick =
      e => {

        e.stopPropagation();

        if (
          !confirm(
            "Delete this chat?"
          )
        ) return;

        state.chats =
          state.chats.filter(
            x =>
              x.id !== chat.id
          );

        saveChats();

        if (
          state.activeChat ===
          chat.id
        ) {
          createNewChat();
        }

        renderHistory();
      };

    actions.append(
      rename,
      del
    );

    row.append(
      name,
      actions
    );

    row.onclick =
      () => loadChat(
        chat.id
      );

    historyList.appendChild(
      row
    );
  }

  lucide.createIcons();
}


function createNewChat(){

  const chat = {

    id:
      crypto.randomUUID(),

    title:
      "New Chat",

    messages:[],

    previousInteractionId:
      null,

    createdAt:
      Date.now()
  };

  state.chats.unshift(
    chat
  );

  state.activeChat =
    chat.id;

  state.previousInteractionId =
    null;

  saveChats();

  renderHistory();

  renderChat();

  closeDrawer();
}


function activeChat(){

  return state.chats.find(
    x =>
      x.id ===
      state.activeChat
  );
}


function loadChat(id){

  const chat =
    state.chats.find(
      x =>
        x.id === id
    );

  if (!chat) return;

  state.activeChat =
    id;

  state.previousInteractionId =
    chat.previousInteractionId ||
    null;

  renderChat();

  closeDrawer();
}


function renderChat(){

  const chat =
    activeChat();

  $("chatTitle")
    .textContent =
    chat?.title ||
    "New Chat";

  if (
    !chat ||
    !chat.messages.length
  ) {

    welcome.style.display =
      "flex";

    messages.style.display =
      "none";

    messages.innerHTML =
      "";

    return;
  }

  welcome.style.display =
    "none";

  messages.style.display =
    "block";

  messages.innerHTML =
    "";

  chat.messages.forEach(
    (msg,index) => {

      addMessageElement(
        msg,
        index
      );

    }
  );

  scrollBottom();
}


/* -----------------------------
   MESSAGE RENDERING
----------------------------- */

function escapeHtml(str){

  return String(str)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


function markdown(text){

  if (
    typeof marked !==
    "undefined"
  ) {

    return marked.parse(
      text,
      {
        breaks:true
      }
    );

  }

  return escapeHtml(
    text
  ).replace(
    /\n/g,
    "<br>"
  );
}


function addMessageElement(
  msg,
  index
){

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "message " +
    (
      msg.role ===
      "user"
        ? "user"
        : "assistant"
    );

  const avatar =
    document.createElement(
      "div"
    );

  avatar.className =
    "avatar";

  avatar.innerHTML =
    msg.role === "user"
      ? '<i data-lucide="user"></i>'
      : '<i data-lucide="graduation-cap"></i>';

  const body =
    document.createElement(
      "div"
    );

  body.className =
    "message-body";

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  if (
    msg.role ===
    "assistant"
  ) {

    bubble.innerHTML =
      markdown(
        msg.content ||
        ""
      );

  } else {

    bubble.textContent =
      msg.content ||
      "";
  }

  body.appendChild(
    bubble
  );

  if (
    msg.role ===
    "assistant" &&
    msg.content
  ) {

    const tools =
      document.createElement(
        "div"
      );

    tools.className =
      "message-tools";

    const copy =
      document.createElement(
        "button"
      );

    copy.className =
      "tool-mini";

    copy.innerHTML =
      '<i data-lucide="copy"></i> Copy';

    copy.onclick =
      async () => {

        await navigator
          .clipboard
          .writeText(
            msg.content
          );

        toast(
          "Copied."
        );
      };

    const feedback =
      document.createElement(
        "button"
      );

    feedback.className =
      "tool-mini";

    feedback.innerHTML =
      '<i data-lucide="thumbs-up"></i> Feedback';

    feedback.onclick =
      () => openFeedback(
        msg.content
      );

    tools.append(
      copy,
      feedback
    );

    /*
     * Regenerate only for latest
     * assistant answer.
     */
    if (
      index ===
      activeChat().messages.length - 1
    ) {

      const regen =
        document.createElement(
          "button"
        );

      regen.className =
        "tool-mini";

      regen.innerHTML =
        '<i data-lucide="refresh-cw"></i> Regenerate';

      regen.onclick =
        () =>
          regenerate(index);

      tools.append(
        regen
      );
    }

    body.appendChild(
      tools
    );
  }

  if (
    msg.role ===
    "user"
  ) {

    wrapper.append(
      body
    );

  } else {

    wrapper.append(
      avatar,
      body
    );
  }

  messages.appendChild(
    wrapper
  );

  lucide.createIcons();
}


function scrollBottom(){

  const chat =
    $("chat");

  chat.scrollTop =
    chat.scrollHeight;
}


/* -----------------------------
   INPUT
----------------------------- */

function resizeInput(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      180
    ) + "px";
}

input.addEventListener(
  "input",
  () => {

    resizeInput();

    updateSendButton();

  }
);

function updateSendButton(){

  if (
    state.generating
  ) {

    sendBtn.disabled =
      false;

    sendBtn.classList.add(
      "stop"
    );

    sendBtn.innerHTML =
      '<i data-lucide="square"></i>';

  } else {

    sendBtn.classList.remove(
      "stop"
    );

    sendBtn.disabled =
      !input.value.trim();

    sendBtn.innerHTML =
      '<i data-lucide="arrow-up"></i>';
  }

  lucide.createIcons();
}


/* -----------------------------
   SEND
----------------------------- */

async function sendMessage(
  suppliedText = null
){

  if (
    state.generating
  ) return;

  const text =
    (
      suppliedText ??
      input.value
    ).trim();

  if (!text) {
    updateSendButton();
    return;
  }

  if (
    !activeChat()
  ) {
    createNewChat();
  }

  const chat =
    activeChat();

  /*
   * Add user message exactly once.
   */
  chat.messages.push({
    role:"user",
    content:text
  });

  if (
    chat.title ===
    "New Chat"
  ) {

    chat.title =
      text.length > 35
        ? text.slice(0,35) +
          "…"
        : text;

    $("chatTitle")
      .textContent =
      chat.title;
  }

  input.value =
    "";

  resizeInput();

  state.generating =
    true;

  state.controller =
    new AbortController();

  updateSendButton();

  renderChat();

  const assistant =
    {
      role:"assistant",
      content:""
    };

  chat.messages.push(
    assistant
  );

  addMessageElement(
    assistant,
    chat.messages.length - 1
  );

  const thinkingEl =
    document.createElement(
      "div"
    );

  thinkingEl.className =
    "thinking";

  thinkingEl.innerHTML =
    `
      <div class="dots">
        <i></i><i></i><i></i>
      </div>
      <span>${getIndicator(text)}</span>
    `;

  messages
    .lastElementChild
    ?.querySelector(
      ".message-body"
    )
    ?.prepend(
      thinkingEl
    );

  try {

    const payload = {

      message:text,

      previousInteractionId:
        chat.previousInteractionId ||
        null,

      attachments:
        state.attachments.map(
          x => ({
            data:x.data,
            mimeType:x.mimeType,
            name:x.name
          })
        ),

      webSearch:
        state.webSearch,

      studyMode:
        state.studyMode,

      academicMaster:
        state.academicMaster,

      strictSubject:
        state.strictSubject,

      codingAssistant:
        state.codingAssistant,

      thinkingLevel:
        state.thinkingLevel
    };

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            ),

          signal:
            state.controller.signal
        }
      );

    if (
      !response.ok
    ) {

      const errorText =
        await response.text();

      throw new Error(
        errorText ||
        `HTTP ${response.status}`
      );
    }

    if (
      !response.body
    ) {
      throw new Error(
        "Streaming is unavailable."
      );
    }

    const reader =
      response.body
        .getReader();

    const decoder =
      new TextDecoder();

    let buffer = "";

    while(true){

      const {
        value,
        done
      } =
        await reader.read();

      if(done) break;

      buffer +=
        decoder.decode(
          value,
          {
            stream:true
          }
        );

      const events =
        buffer.split(
          "\n\n"
        );

      buffer =
        events.pop() || "";

      for (
        const eventText of events
      ) {

        parseSSE(
          eventText,
          assistant,
          thinkingEl,
          chat
        );
      }

      renderLatestAssistant(
        assistant
      );

      scrollBottom();
    }

    if (
      !assistant.content
    ) {
      assistant.content =
        "I didn't receive a text response from Gemini.";
    }

  } catch(error){

    if (
      error.name ===
      "AbortError"
    ) {

      if (
        !assistant.content
      ) {
        assistant.content =
          "Generation stopped.";
      }

    } else {

      console.error(
        error
      );

      assistant.content =
        "⚠️ " +
        (
          error.message ||
          "Something went wrong."
        );
    }

  } finally {

    thinkingEl.remove();

    state.generating =
      false;

    state.controller =
      null;

    state.attachments =
      [];

    renderAttachments();

    saveChats();

    renderHistory();

    updateSendButton();

    renderLatestAssistant(
      assistant
    );

    ping();

    scrollBottom();
  }
}


function parseSSE(
  raw,
  assistant,
  thinkingEl,
  chat
){

  const lines =
    raw.split("\n");

  let dataLine = "";

  for(
    const line of lines
  ){

    if(
      line.startsWith(
        "data:"
      )
    ){

      dataLine +=
        line.slice(5).trim();
    }
  }

  if(!dataLine) return;

  try{

    const event =
      JSON.parse(
        dataLine
      );

    /*
     * New Interactions API.
     */
    if(
      event.event_type ===
      "interaction.created"
    ){

      const id =
        event.interaction?.id;

      if(id){

        chat.previousInteractionId =
          id;
      }

    }

    if(
      event.event_type ===
      "step.delta"
    ){

      const delta =
        event.delta;

      if(
        delta?.type ===
        "text"
      ){

        assistant.content +=
          delta.text || "";

        if(
          thinkingEl
        ){
          thinkingEl.remove();
        }

        saveChats();
      }
    }

    if(
      event.event_type ===
      "interaction.completed"
    ){

      const id =
        event.interaction?.id;

      if(id){

        chat.previousInteractionId =
          id;
      }
    }

  }catch(error){

    console.debug(
      "SSE parse:",
      error
    );

  }
}


function renderLatestAssistant(
  assistant
){

  const list =
    messages.querySelectorAll(
      ".message.assistant"
    );

  const last =
    list[list.length - 1];

  if(!last) return;

  const bubble =
    last.querySelector(
      ".bubble"
    );

  if(bubble){

    bubble.innerHTML =
      markdown(
        assistant.content ||
        ""
      );
  }

  lucide.createIcons();
}


function getIndicator(text){

  const lower =
    text.toLowerCase();

  if(
    state.webSearch
  ){
    return "Finding information…";
  }

  if(
    state.attachments.length
  ){
    return "Analyzing file…";
  }

  if(
    state.codingAssistant ||
    /code|javascript|python|html|css|program/i
      .test(lower)
  ){
    return "Coding…";
  }

  if(
    /solve|calculate|equation|math|compute|what is \d/i
      .test(lower)
  ){
    return "Solving…";
  }

  return "Thinking…";
}


/* -----------------------------
   STOP
----------------------------- */

function stopGeneration(){

  if(
    state.controller
  ){
    state.controller.abort();
  }
}


/* -----------------------------
   REGENERATE
----------------------------- */

async function regenerate(
  assistantIndex
){

  if(
    state.generating
  ) return;

  const chat =
    activeChat();

  if(!chat) return;

  let userIndex =
    assistantIndex - 1;

  while(
    userIndex >= 0 &&
    chat.messages[userIndex].role !==
      "user"
  ){
    userIndex--;
  }

  if(
    userIndex < 0
  ) return;

  const original =
    chat.messages[userIndex]
      .content;

  /*
   * Remove the old assistant
   * and everything after the
   * user prompt.
   */
  chat.messages =
    chat.messages.slice(
      0,
      userIndex
    );

  /*
   * Because server state is tied
   * to previous interaction ID,
   * restart this chat chain.
   */
  chat.previousInteractionId =
    null;

  state.previousInteractionId =
    null;

  saveChats();

  renderChat();

  await sendMessage(
    original
  );
}


/* -----------------------------
   SEND CLICK + TOUCH
----------------------------- */

sendBtn.addEventListener(
  "click",
  e => {

    e.preventDefault();

    if(
      state.generating
    ){
      stopGeneration();
      return;
    }

    sendMessage();

  }
);


/* -----------------------------
   ENTER
----------------------------- */

input.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendMessage();

    }
  }
);


/* -----------------------------
   QUICK PROMPTS
----------------------------- */

document.querySelectorAll(
  ".quick"
).forEach(
  button => {

    button.onclick =
      () => {

        input.value =
          button.dataset.prompt;

        resizeInput();

        updateSendButton();

        input.focus();
      };

  }
);


/* -----------------------------
   MODE BUTTONS
----------------------------- */

function toggleMode(
  button,
  key
){

  state[key] =
    !state[key];

  button.classList.toggle(
    "active",
    state[key]
  );
}

$("webBtn").onclick =
() =>
  toggleMode(
    $("webBtn"),
    "webSearch"
  );

$("studyBtn").onclick =
() =>
  toggleMode(
    $("studyBtn"),
    "studyMode"
  );

$("masterBtn").onclick =
() =>
  toggleMode(
    $("masterBtn"),
    "academicMaster"
  );

/* -----------------------------
   FILE ATTACHMENT
----------------------------- */

$("attachBtn").onclick =
() =>
  $("fileInput").click();

$("fileInput").onchange =
async e => {

  const files =
    [...e.target.files];

  for(
    const file of files
  ){

    /*
     * Keep browser request payload
     * reasonably small for Vercel.
     */
    if(
      file.size >
      5 * 1024 * 1024
    ){

      toast(
        `${file.name} is larger than 5 MB.`
      );

      continue;
    }

    try{

      const data =
        await fileToBase64(
          file
        );

      state.attachments.push({
        name:file.name,
        mimeType:file.type ||
          "application/octet-stream",
        data
      });

    }catch{

      toast(
        `Unable to read ${file.name}`
      );
    }
  }

  renderAttachments();

  e.target.value =
    "";
};


function fileToBase64(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => {

          const result =
            String(
              reader.result
            );

          resolve(
            result.split(",")[1]
          );
        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );
    }
  );
}


function renderAttachments(){

  const box =
    $("attachPreview");

  box.innerHTML =
    "";

  state.attachments.forEach(
    (file,index) => {

      const chip =
        document.createElement(
          "div"
        );

      chip.className =
        "file-chip";

      chip.innerHTML =
        `
          <i data-lucide="file"></i>
          <span>${escapeHtml(file.name)}</span>
        `;

      chip.onclick =
        () => {

          state.attachments
            .splice(
              index,
              1
            );

          renderAttachments();

        };

      box.appendChild(
        chip
      );
    }
  );

  lucide.createIcons();
}


/* -----------------------------
   VOICE INPUT
----------------------------- */

let recognition = null;

$("voiceBtn").onclick =
() => {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(
    !SpeechRecognition
  ){

    toast(
      "Voice input is not supported by this browser."
    );

    return;
  }

  if(
    recognition
  ){

    recognition.stop();

    recognition =
      null;

    return;
  }

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-US";

  recognition.interimResults =
    true;

  recognition.continuous =
    false;

  recognition.onresult =
    event => {

      let text = "";

      for(
        let i =
          event.resultIndex;
        i <
          event.results.length;
        i++
      ){

        text +=
          event.results[i][0]
            .transcript;
      }

      input.value =
        text;

      resizeInput();

      updateSendButton();
    };

  recognition.onerror =
    () => {

      toast(
        "Voice input failed."
      );

      recognition =
        null;
    };

  recognition.onend =
    () => {

      recognition =
        null;
    };

  recognition.start();

  toast(
    "Listening…"
  );
};


/* -----------------------------
   DOLA
----------------------------- */

$("dolaBtn").onclick =
() =>
  openModal(
    "dolaModal"
  );


$("generateImage").onclick =
async () => {

  const prompt =
    $("dolaPrompt")
      .value
      .trim();

  if(!prompt){

    toast(
      "Enter an image prompt."
    );

    return;
  }

  const button =
    $("generateImage");

  button.disabled =
    true;

  button.textContent =
    "Generating…";

  try{

    let imageData =
      null;

    let mimeType =
      null;

    const file =
      $("dolaFile")
        .files[0];

    if(file){

      if(
        file.size >
        5 * 1024 * 1024
      ){

        throw new Error(
          "Image must be 5 MB or smaller."
        );
      }

      imageData =
        await fileToBase64(
          file
        );

      mimeType =
        file.type;
    }

    const response =
      await fetch(
        "/api/image",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({

              prompt,

              imageData,

              mimeType,

              aspectRatio:
                $("dolaRatio")
                  .value,

              imageSize:
                $("dolaSize")
                  .value
            })
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Image generation failed."
      );
    }

    const image =
      $("dolaResult");

    image.src =
      `data:${data.mimeType};base64,${data.image}`;

    image.style.display =
      "block";

    const download =
      $("downloadImage");

    download.style.display =
      "block";

    download.onclick =
      () => {

        const a =
          document.createElement(
            "a"
          );

        a.href =
          image.src;

        a.download =
          "jampong-ai-image." +
          (
            data.mimeType ===
            "image/jpeg"
              ? "jpg"
              : "png"
          );

        a.click();
      };

    toast(
      "Image generated successfully."
    );

  }catch(error){

    toast(
      error.message ||
      "Image generation failed."
    );

  }finally{

    button.disabled =
      false;

    button.innerHTML =
      `
        <i data-lucide="sparkles"></i>
        Generate / Edit Image
      `;

    lucide.createIcons();
  }
};


/* -----------------------------
   CALCULATOR
----------------------------- */

$("calcBtn").onclick =
() =>
  openModal(
    "calcModal"
  );

$("calcRun").onclick =
() => {

  const expression =
    $("calcInput")
      .value
      .trim();

  if(!expression){

    $("calcResult")
      .textContent =
      "Enter an expression.";

    return;
  }

  /*
   * Safe-ish calculator parser:
   * only numeric arithmetic characters.
   */
  if(
    !/^[0-9+\-*/().%\s]+$/
      .test(expression)
  ){

    $("calcResult")
      .textContent =
      "Only arithmetic expressions are allowed.";

    return;
  }

  try{

    const result =
      Function(
        `"use strict";return (${expression})`
      )();

    if(
      typeof result !==
      "number" ||
      !Number.isFinite(result)
    ){
      throw new Error();
    }

    $("calcResult")
      .textContent =
      String(result);

  }catch{

    $("calcResult")
      .textContent =
      "Invalid expression.";

  }
};

/* -----------------------------
   FEEDBACK
----------------------------- */

let feedbackTarget =
  "";

function openFeedback(
  content
){

  feedbackTarget =
    content || "";

  openModal(
    "feedbackModal"
  );
}

$("sendFeedback").onclick =
async () => {

  const text =
    $("feedbackText")
      .value
      .trim();

  try{

    const response =
      await fetch(
        "/api/feedback",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({

              rating:"up",

              message:text,

              conversationId:
                state.activeChat
            })
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){
      throw new Error(
        data.error ||
        "Feedback failed."
      );
    }

    $("feedbackText")
      .value =
      "";

    closeModal(
      "feedbackModal"
    );

    toast(
      "Feedback received."
    );

  }catch(error){

    toast(
      error.message
    );
  }
};


/* -----------------------------
   MODALS
----------------------------- */

function openModal(id){

  $(id)
    .classList.add(
      "show"
    );
}

function closeModal(id){

  $(id)
    .classList.remove(
      "show"
    );
}

document.querySelectorAll(
  "[data-close]"
).forEach(
  button => {

    button.onclick =
      () =>
        closeModal(
          button.dataset.close
        );
  }
);

document.querySelectorAll(
  ".modal"
).forEach(
  modal => {

    modal.addEventListener(
      "click",
      e => {

        if(
          e.target === modal
        ){
          modal.classList.remove(
            "show"
          );
        }

      }
    );

  }
);


/* -----------------------------
   PING
----------------------------- */

async function ping(){

  const target =
    $("ping");

  const started =
    performance.now();

  try{

    const response =
      await fetch(
        "/api/ping",
        {
          method:"GET",
          cache:"no-store"
        }
      );

    if(
      !response.ok
    ){
      throw new Error();
    }

    const ms =
      Math.round(
        performance.now() -
        started
      );

    target.innerHTML =
      `
        <i data-lucide="activity"
           size="13"></i>
        <span>${ms} ms</span>
      `;

    lucide.createIcons();

  }catch{

    target.innerHTML =
      `
        <i data-lucide="wifi-off"
           size="13"></i>
        <span>Offline</span>
      `;

    lucide.createIcons();
  }
}
